[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pygeofilter-fes2"
version = "0.1.0"
description = "Offline CQL2 to OGC Filter Encoding 2.0 XML translation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["pygeofilter==0.4.0", "lxml>=5,<7", "shapely>=2.1,<3"]

[project.urls]
Source = "https://github.com/Terradue/pygeofilter-fes2"

[tool.hatch.build.targets.wheel]
packages = ["src/pygeofilter_fes2"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/examples", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]

[tool.hatch.envs.dev]
dependencies = ["ruff>=0.16,<0.17", "mypy>=1.19,<3", "bandit>=1.9,<2", "types-lxml", "types-shapely", "pytest>=8,<10"]

[tool.hatch.envs.dev.scripts]
format = "ruff format src tests examples"
fix = ["ruff check --fix src tests examples", "ruff format src tests examples"]
format-check = "ruff format --check src tests examples"
lint-check = "ruff check src tests examples"
typecheck = "mypy src tests examples"
security = "bandit -r src"
check = ["format-check", "lint-check", "typecheck", "security", "pytest tests"]

[tool.hatch.envs.test]
dependencies = ["pytest>=8,<10", "types-lxml"]
[tool.hatch.envs.test.scripts]
test = "pytest {args:tests}"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
xfail_strict = true

[tool.ruff]
target-version = "py310"
line-length = 100
[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "FA", "TC", "B", "RET", "PTH", "C4", "SIM", "C90", "PLE", "PLW", "PLR", "PERF", "RUF"]
ignore = ["E501"]
[tool.ruff.lint.mccabe]
max-complexity = 7
[tool.ruff.lint.pylint]
max-args = 6
max-branches = 10
max-returns = 6
max-statements = 40

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
[[tool.mypy.overrides]]
module = ["pygeofilter.*"]
follow_untyped_imports = true
